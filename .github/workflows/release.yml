name: Release

on:
  workflow_dispatch: # 仅保留手动触发

jobs:
  build-module:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils erofsfuse unzip xz-utils aria2
          
          wget -q https://github.com/ssut/payload-dumper-go/releases/download/1.3.0/payload-dumper-go_1.3.0_linux_amd64.tar.gz
          tar -xzf payload-dumper-go_1.3.0_linux_amd64.tar.gz
          chmod +x payload-dumper-go
          rm payload-dumper-go_1.3.0_linux_amd64.tar.gz

      - name: Download HyperOS
        run: |
          ROM_URL="https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.216.0.VOLCNXM/onyx-ota_full-OS2.0.216.0.VOLCNXM-user-15.0-6e1ac7510e.zip"
          
          echo "开始多线程高速下载 ROM..."
          aria2c -x 16 -s 16 -k 1M -j 1 -m 5 --timeout=60 --show-console-readout=true --summary-interval=10 -o rom.zip "$ROM_URL"
          
          FILE_SIZE=$(stat -c%s "rom.zip")
          if [ "$FILE_SIZE" -lt 1000000000 ]; then
            echo "::error::下载失败或链接已失效！文件大小仅为 $FILE_SIZE bytes。"
            exit 1
          fi
          echo "✅ 下载完成，文件大小: $FILE_SIZE bytes。"
          
          unzip rom.zip payload.bin
          rm rom.zip

      - name: Unpack HyperOS
        run: |
          ./payload-dumper-go -o ./ -p product ./payload.bin
          rm payload.bin
          mkdir product
          fsck.erofs product.img --extract=product
          df -h
          free -h

      - name: Assemble module
        run: |
          # 打印 product/app 目录结构,便于排查路径差异
          echo "===== product/app 目录结构 ====="
          ls -la ./product/app/ | grep -E 'MINextpay|MITSMClient|UPTsmService|MipayWallet|PaymentService' || true
          echo "================================"

          # 仅提取门卡/交通卡链路所需的 NFC 服务组件
          # MINextpay:      小米支付组件(智能卡网页/服务桥)
          # MITSMClient:    小米智能卡(NFC 卡片底层管理与通信)
          # UPTsmService:   银联 TSM 服务(公交卡付款/充值必需)
          # 注: MipayWallet(小米钱包)由用户在设备端自行安装,本模块不重复提供
          # 注: PaymentService(小米支付服务)用于 Mi Pay 银行卡闪付,本模块不需要
          cp -a ./product/app/MINextpay ./module/system/product/app/MINextpay
          cp -a ./product/app/MITSMClient ./module/system/product/app/MITSMClient
          cp -a ./product/app/UPTsmService ./module/system/product/app/UPTsmService

          rm -f ./module/system/product/app/.gitkeep

      - name: Package module
        run: |
          cd module/
          # 确保 service.sh / uninstall.sh 有可执行权限
          chmod +x service.sh uninstall.sh customize.sh 2>/dev/null || true
          zip -r ../MiPay4XiaomiEU.zip *

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-OS2.0.216.0-${{ github.run_number }}
          name: MiPay Module OS2.0.216.0 (Build ${{ github.run_number }})
          files: MiPay4XiaomiEU.zip
          generate_release_notes: true 
